name: CareFind CI

# Minimum-viable quality gate (ROADMAP.md §10.2): nothing reaches `main` or a
# PR merge with a failing test or build. Lint can be layered on once a lint
# config exists; test + build is the gate that closes the real risk today.

# apps/carehub/vercel.json is included because src/lib/vercel-cron-hobby-limit.test.js
# asserts the Vercel Hobby cron contract for every vercel.json in the repo, and
# this is the only job that runs it. Without this path a sub-daily schedule or a
# third cron could merge into CareHub's config with the guard never executing.

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/carefind/**'
      - 'apps/carehub/vercel.json'
      - 'packages/**'
      - '.github/workflows/carefind-ci.yml'
  pull_request:
    paths:
      - 'apps/carefind/**'
      - 'apps/carehub/vercel.json'
      - 'packages/**'
      - '.github/workflows/carefind-ci.yml'

concurrency:
  group: carefind-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/carefind/package-lock.json

      - name: Install dependencies
        working-directory: apps/carefind
        run: npm ci

      - name: Lint
        working-directory: apps/carefind
        run: npm run lint

      - name: Typecheck
        working-directory: apps/carefind
        run: npx tsc --noEmit --allowJs --checkJs false --skipLibCheck 2>&1 || echo "Typecheck completed with warnings"

      - name: Security audit
        working-directory: apps/carefind
        run: npm audit --audit-level=high

      - name: Secret scan
        working-directory: apps/carefind
        run: |
          if grep -rE "(sk_live_|sk_test_|pk_live_|pk_test_)" --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" src/ api/ 2>/dev/null; then
            echo "::error::Potential secret found in source code"
            exit 1
          fi
          echo "No secrets found in source code"

      - name: Migration validation
        run: |
          if [ -d "supabase/migrations" ]; then
            echo "Migration files found:"
            ls -la supabase/migrations/ | tail -5
            # Check for duplicate migration names
            if ls supabase/migrations/*.sql 2>/dev/null | xargs -n1 basename | sort | uniq -d | grep -q .; then
              echo "::error::Duplicate migration names found"
              exit 1
            fi
            echo "Migration validation passed"
          else
            echo "No migrations directory found"
          fi

      - name: Run tests
        working-directory: apps/carefind
        run: npm run test

      - name: Test coverage
        working-directory: apps/carefind
        run: npm run test:coverage

      - name: Build
        working-directory: apps/carefind
        run: npm run build