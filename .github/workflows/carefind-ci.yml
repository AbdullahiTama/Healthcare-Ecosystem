name: CareFind CI

# Minimum-viable quality gate (ROADMAP.md §10.2): nothing reaches `main` or a
# PR merge with a failing test or build. Lint can be layered on once a lint
# config exists; test + build is the gate that closes the real risk today.

# apps/carehub/vercel.json is included because src/lib/vercel-cron-hobby-limit.test.js
# asserts the Vercel Hobby cron contract for every vercel.json in the repo, and
# this is the only job that runs it. Without this path a sub-daily schedule or a
# third cron could merge into CareHub's config with the guard never executing.

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/carefind/**'
      - 'apps/carehub/vercel.json'
      - 'packages/**'
      - 'supabase/**'
      - '.github/workflows/carefind-ci.yml'
  pull_request:
    paths:
      - 'apps/carefind/**'
      - 'apps/carehub/vercel.json'
      - 'packages/**'
      - 'supabase/**'
      - '.github/workflows/carefind-ci.yml'

concurrency:
  group: carefind-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/carefind/package-lock.json

      - name: Install dependencies
        working-directory: apps/carefind
        run: npm ci

      - name: Lint
        working-directory: apps/carefind
        run: npm run lint

      - name: Security audit
        working-directory: apps/carefind
        run: npm audit --audit-level=high

      - name: Run tests
        working-directory: apps/carefind
        run: npm run test

      - name: Test coverage
        working-directory: apps/carefind
        run: npm run test:coverage

      - name: Build
        working-directory: apps/carefind
        run: npm run build

  # The financial system: every money migration is replayed on a real Postgres, the engines are exercised through it, the
  # concurrency suites run with genuinely overlapping transactions (they are SKIPPED without PG_CONCURRENCY_URL, so the job above
  # never runs them), and the shared payments package is tested on its own. A change to any migration triggers this job.
  finance-suite:
    name: Financial suite (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PG_CONCURRENCY_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/carefind/package-lock.json
            packages/shared-payments/package-lock.json

      - name: Install CareFind
        working-directory: apps/carefind
        run: npm ci

      - name: Install shared-payments
        working-directory: packages/shared-payments
        run: npm ci

      - name: shared-payments unit tests
        working-directory: packages/shared-payments
        run: npm test

      - name: Financial tests (PGlite migrations, engines, handlers)
        working-directory: apps/carefind
        run: npm run test:finance

      - name: Real-Postgres concurrency suites
        working-directory: apps/carefind
        run: npm run test:finance:pg
