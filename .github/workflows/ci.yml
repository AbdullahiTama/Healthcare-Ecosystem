name: CI

# Minimum-viable quality gate: every workspace's test suite, plus a production
# build for the two apps, on every push to main and every pull request.
#
# Deliberately not a multi-stage pipeline — per planning/ROADMAP.md §5.2, two
# working jobs beat one elaborate unstarted one. Things intentionally NOT here:
#
#   * Lint. No ESLint config exists anywhere in the repo. packages/design-system
#     declares a lint script but ships no config to run it against. Adding one
#     means choosing a ruleset and then triaging what it flags across ~32k
#     lines — its own initiative, not CI setup.
#   * Deploy gating. Vercel deploys straight from a push today; making CI a
#     required check is a repo setting, not a workflow step (ROADMAP §8).
#   * E2E. None exist yet (ROADMAP Phase 6).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      # One workspace going red must not hide the state of the other three.
      fail-fast: false
      # packages/design-system is deliberately absent: it has no tests and no
      # lint config, so there is nothing to run. It is not untested, though —
      # both apps consume it through a Vite path alias (see their
      # vite.config.js / vitest.config.js), not through npm, so it is compiled
      # and exercised by the carefind and carehub jobs below. A break in it
      # fails those, which is why no npm dependency on it is declared or needed.
      matrix:
        include:
          - name: shared-marketplace
            dir: packages/shared-marketplace
            build: false
          - name: shared-notifications
            dir: packages/shared-notifications
            build: false
          - name: carefind
            dir: apps/carefind
            build: true
          - name: carehub
            dir: apps/carehub
            build: true

    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    steps:
      - uses: actions/checkout@v4

      # There is no root package.json and no npm workspaces — each workspace
      # installs from its own lockfile, so the cache key is per-directory.
      # The apps pull packages/* through `file:` links, which resolve inside
      # the checkout, so no publish or hoisting step is needed.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # Both apps read VITE_SUPABASE_* at build time via import.meta.env. .env
      # is gitignored, so CI uses the tracked .env.example, which carries only
      # the publishable (public-by-design) credentials — never a service-role
      # or Paystack secret. This proves the bundle compiles; it is not a
      # deployable artifact.
      - name: Provide build-time env
        if: matrix.build
        run: cp .env.example .env

      - name: Build
        if: matrix.build
        run: npm run build
