name: CareHub CI

# Minimum-viable quality gate (ROADMAP.md §10.2): nothing reaches `main` or a
# PR merge with a failing test or build. Lint can be layered on once a lint
# config exists; test + build is the gate that closes the real risk today.

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/carehub/**'
      - 'packages/**'
      - '.github/workflows/carehub-ci.yml'
      - 'scripts/audit-gate*.mjs'
      - '.github/audit-exceptions.json'
  pull_request:
    paths:
      - 'apps/carehub/**'
      - 'packages/**'
      - '.github/workflows/carehub-ci.yml'
      - 'scripts/audit-gate*.mjs'
      - '.github/audit-exceptions.json'

concurrency:
  group: carehub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/carehub/package-lock.json

      - name: Install dependencies
        working-directory: apps/carehub
        run: npm ci

      - name: Lint
        working-directory: apps/carehub
        run: npm run lint

      # An undefined identifier is a RUNTIME crash, not a build failure. See the note in carefind-ci.yml.
      - name: No undefined identifiers
        working-directory: apps/carehub
        run: npm run lint:undef

      # High/critical advisories fail: always in production dependencies; in build and test tools unless listed,
      # with a reason and an expiry date, in .github/audit-exceptions.json (only for advisories with no fixed version).
      - name: Security audit
        working-directory: apps/carehub
        run: node ../../scripts/audit-gate.mjs

      - name: Security audit gate tests
        run: node --test scripts/audit-gate.test.mjs

      - name: Run tests
        working-directory: apps/carehub
        run: npm run test

      - name: Test coverage
        working-directory: apps/carehub
        run: npm run test:coverage

      - name: Build
        working-directory: apps/carehub
        run: npm run build