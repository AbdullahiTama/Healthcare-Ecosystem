      <stop offset="0" stop-color="#0E6F5A"/>
      <stop offset="1" stop-color="#0A5A48"/>
    </linearGradient>
  </defs>
  <!-- Location pin shape -->
  <path d="M32 4C20.954 4 12 12.954 12 24c0 14.25 20 36 20 36s20-21.75 20-36C52 12.954 43.046 4 32 4z" fill="url(#pinGrad)"/>
