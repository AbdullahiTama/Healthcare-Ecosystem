<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="CareHub is an intelligent business management platform fully designed for healthcare, wellness, beauty and personal-care businesses. Manage inventory, sales, staff, appointments, finances and more while increasing visibility across the CareFind health social platform. Start your 30-day free trial." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <title>CareHub | Smart Business Management Software for Healthcare, Wellness &amp; Beauty Businesses</title>
    <script>
      // FOUC guard: set data-theme before React paints (dark-first, honors saved + system light)
      (function(){try{var s=localStorage.getItem('carehub_theme');if(s==='light'||s==='dark'){document.documentElement.setAttribute('data-theme',s);return}var m=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)');document.documentElement.setAttribute('data-theme',m&&m.matches?'light':'dark')}catch(e){}})();
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: "Geist", system-ui, -apple-system, sans-serif; background: #f9f9f6; }
      #root { height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
