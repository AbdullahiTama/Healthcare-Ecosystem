<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- CareHub Logo: Connected nodes symbol -->
  <defs>
    <linearGradient id="hubGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E6F5A"/>
      <stop offset="1" stop-color="#0A5A48"/>
    </linearGradient>
  </defs>
  <!-- Central node -->
  <circle cx="32" cy="32" r="8" fill="url(#hubGrad)"/>
  <!-- Top node -->
  <circle cx="32" cy="12" r="6" fill="url(#hubGrad)"/>
  <!-- Bottom node -->
  <circle cx="32" cy="52" r="6" fill="url(#hubGrad)"/>
  <!-- Left node -->
  <circle cx="12" cy="32" r="6" fill="url(#hubGrad)"/>
  <!-- Right node -->
  <circle cx="52" cy="32" r="6" fill="url(#hubGrad)"/>
  <!-- Connecting lines -->
  <line x1="32" y1="20" x2="32" y2="24" stroke="url(#hubGrad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="40" x2="32" y2="46" stroke="url(#hubGrad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="32" x2="24" y2="32" stroke="url(#hubGrad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="32" x2="46" y2="32" stroke="url(#hubGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Inner connecting arcs -->
  <path d="M26 26 L22 22" stroke="url(#hubGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M38 26 L42 22" stroke="url(#hubGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M26 38 L22 42" stroke="url(#hubGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M38 38 L42 42" stroke="url(#hubGrad)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
