<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- CareHub Logo: Connected nodes symbol (4 circles in diamond pattern) -->
  <!-- Top node -->
  <circle cx="32" cy="14" r="6" fill="#0E6F5A"/>
  <!-- Bottom node -->
  <circle cx="32" cy="50" r="6" fill="#0E6F5A"/>
  <!-- Left node -->
  <circle cx="14" cy="32" r="6" fill="#0E6F5A"/>
  <!-- Right node -->
  <circle cx="50" cy="32" r="6" fill="#0E6F5A"/>
  <!-- Connecting lines -->
  <line x1="32" y1="20" x2="32" y2="44" stroke="#0E6F5A" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="32" x2="44" y2="32" stroke="#0E6F5A" stroke-width="3" stroke-linecap="round"/>
</svg>
